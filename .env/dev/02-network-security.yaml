AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Abaris | 02-network-security
  Security Groups, WAF Web ACL (rate limiting + managed rule groups), WAF logging.
  Depends on: 01-core

Resources:

  # --- Security Groups ---

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Abaris ALB - public ingress HTTP and HTTPS
      VpcId: !ImportValue abaris-core-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: abaris-alb-sg

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Abaris ECS tasks - accept traffic from ALB only
      VpcId: !ImportValue abaris-core-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: abaris-ecs-sg

  CodeBuildSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CodeBuild outbound only (ECR pulls, GitHub)
      VpcId: !ImportValue abaris-core-VpcId
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: abaris-codebuild-sg

  # --- WAF Web ACL ---
  # Rules (priority order):
  #   0 — Rate limit: 1000 req / 5 min per IP
  #   1 — AWS Managed: Common Rule Set (OWASP Top 10)
  #   2 — AWS Managed: Known Bad Inputs (log4j, Spring4Shell, etc.)

  WAFWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: abaris-waf
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: abaris-waf
      Rules:
        - Name: RateLimitPerIP
          Priority: 0
          Action:
            Block: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: abaris-rate-limit
          Statement:
            RateBasedStatement:
              Limit: 1000
              AggregateKeyType: IP

        - Name: AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: abaris-common-rules
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet

        - Name: AWSManagedRulesKnownBadInputs
          Priority: 2
          OverrideAction:
            None: {}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: abaris-bad-inputs
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet

  # WAF log group name must start with aws-waf-logs-
  WAFLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: aws-waf-logs-abaris
      RetentionInDays: 30

  WAFLoggingConfiguration:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt WAFWebACL.Arn
      LogDestinationConfigs:
        - !GetAtt WAFLogGroup.Arn

Outputs:
  ALBSecurityGroupId:
    Value: !Ref ALBSecurityGroup
    Export:
      Name: abaris-netsec-ALBSecurityGroupId

  ECSSecurityGroupId:
    Value: !Ref ECSSecurityGroup
    Export:
      Name: abaris-netsec-ECSSecurityGroupId

  CodeBuildSecurityGroupId:
    Value: !Ref CodeBuildSecurityGroup
    Export:
      Name: abaris-netsec-CodeBuildSecurityGroupId

  WAFWebACLArn:
    Value: !GetAtt WAFWebACL.Arn
    Export:
      Name: abaris-netsec-WAFWebACLArn
