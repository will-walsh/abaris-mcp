AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Abaris | 05-pipeline
  S3 artifact bucket, CodeBuild project, and CodePipeline.
  Separated from the application stack so the CI/CD pipeline can be
  updated independently of the running ECS service.
  Depends on: 04-compute (roles, ECR URI, cluster name)

Parameters:
  GitHubConnectionArn:
    Type: String
    Description: >
      ARN of the CodeStar Connections GitHub connection
      (create once via the console — must be in AVAILABLE status).

Resources:

  # -------------------------------------------------------------------------
  # S3 — Pipeline artifact bucket
  # -------------------------------------------------------------------------
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "abaris-pipeline-artifacts-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # -------------------------------------------------------------------------
  # CodeBuild — Docker build + ECR push
  # -------------------------------------------------------------------------
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: abaris-mcp-proxy-build
      ServiceRole: !ImportValue abaris-compute-CodeBuildRoleArn
      Artifacts:
        Type: CODEPIPELINE
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: /codebuild/abaris-mcp-proxy
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true   # required for Docker daemon
        EnvironmentVariables:
          - Name: AWS_ACCOUNT_ID
            Value: !Ref AWS::AccountId
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: ECR_REPO_URI
            Value: !ImportValue abaris-compute-ECRRepositoryUri
      Source:
        Type: CODEPIPELINE

  # -------------------------------------------------------------------------
  # CodePipeline — Source (GitHub main) → Build → Deploy to ECS
  # -------------------------------------------------------------------------
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: abaris-mcp-proxy-pipeline
      RoleArn: !ImportValue abaris-compute-CodePipelineRoleArn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !Ref GitHubConnectionArn
                FullRepositoryId: will-walsh/abaris-mcp
                BranchName: main
                DetectChanges: true
              OutputArtifacts:
                - Name: SourceArtifact

        - Name: Build
          Actions:
            - Name: DockerBuild
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref CodeBuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BuildArtifact

        - Name: Deploy
          Actions:
            - Name: ECSRollingDeploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS
                Version: "1"
              Configuration:
                ClusterName: !ImportValue abaris-compute-ECSClusterName
                ServiceName: abaris-mcp-proxy
                FileName: imagedefinitions.json
              InputArtifacts:
                - Name: BuildArtifact

Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
    Export:
      Name: abaris-pipeline-ArtifactBucketName

  PipelineName:
    Value: !Ref Pipeline
    Export:
      Name: abaris-pipeline-PipelineName
