# config/policies/developers.yaml
# Owner: Developer team
# Hot-reloaded — no restart required.
#
# Grants the "developers" group full access to all tools on the github and
# internal backends. Add more allowed_tools patterns as new backends are
# onboarded. Use denied_tools to carve out exceptions within an allowed glob.

policies:
  - group: developers
    reduced_scope:
      allowed_tools:
        - "github/*"
        - "internal/*"
      # Uncomment to block destructive operations even for developers:
      # denied_tools:
      #   - "github/delete-*"
      #   - "internal/purge-*"
