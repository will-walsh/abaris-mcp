# config/routing.yaml
# Owner: Platform / Infrastructure team
# Requires restart to change.
#
# This file configures:
#   - routes: the prefix → backend URI mapping for all MCP tool families.
#     Set obo_provider to activate the OBO pipeline for a route; leave it
#     empty (or omit it) for the standard service-credentials path.
#   - assertion: Identity Assertion Token minting configuration (KMS key,
#     issuer, audience, TTL).
#
# Replace all PLACEHOLDER values before deploying.

# ---------------------------------------------------------------------------
# Route table
# ---------------------------------------------------------------------------
routes:
  # OBO route — Abaris retrieves the caller's GitHub UAT from the Token Store
  # and forwards it as Authorization: Bearer <UAT> + X-Abaris-Assertion.
  # obo_provider must match a name in identity.yaml secondary_providers.
  - prefix: github
    backend_uri: http://github-mcp-server:8080
    obo_provider: github

  # Standard route — Abaris uses its own service credentials.
  # The service credential secret ARN is resolved at startup from
  # ABARIS_SERVICE_CRED_ARN_<PREFIX> env var (see cmd/abaris/main.go).
  - prefix: internal
    backend_uri: http://internal-mcp-server:8080

  # Add more routes as needed:
  # - prefix: jira
  #   backend_uri: http://jira-mcp-server:8080
  #   obo_provider: jira

# ---------------------------------------------------------------------------
# Identity Assertion Token minting
# ---------------------------------------------------------------------------
assertion:
  # Issuer claim (iss) in every minted JWT — must be a URL.
  issuer: https://abaris.example.com

  # Audience claim (aud) — the expected audience at backend servers.
  audience: https://mcp-backends.internal

  # Token lifetime. Backends should reject tokens older than this.
  ttl: 60s

  # ARN of the KMS asymmetric signing key (RSA_2048 or RSA_4096, SIGN_VERIFY).
  # The private key never leaves KMS; Abaris calls kms:Sign for each token.
  kms_key_arn: arn:aws:kms:REGION:ACCOUNT_ID:key/YOUR_SIGNING_KEY_ID

  # Optional key ID embedded in the JWT kid header claim.
  # Backends use this to select the correct key from the JWKS endpoint.
  signing_key_id: abaris-signing-key-v1
