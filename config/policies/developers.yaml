# config/policies/developers.yaml
# Owner: Developer team
# Hot-reloaded — no restart required.
#
# Read-only access: permits only get/list/search operations on github tools.
# To restore full access, change allowed_tools back to ["github/*", "internal/*"].

policies:
  - group: developers
    reduced_scope:
      allowed_tools:
        - "github/get_*"
        - "github/list_*"
        - "github/search_*"
